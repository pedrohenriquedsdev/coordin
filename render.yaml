# Blueprint do Render (DT-09). Os segredos marcados com sync: false são preenchidos no painel
# do Render e NUNCA entram neste arquivo (DT-30; RNF-05). Plano gratuito: ambiente de teste
# (o banco gratuito expira em 30 dias; ver docs/deployment.md).
services:
  - type: web
    name: coordin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ConnectionStrings__Default
        fromDatabase:
          name: coordin-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      - key: Manager__Email
        sync: false
      - key: Manager__Password
        sync: false

databases:
  - name: coordin-db
    plan: free
    postgresMajorVersion: "18"
