<div class="flex min-h-screen flex-col bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <h1 class="text-xl font-bold tracking-tight">Coordin</h1>

      <!-- Só com sessão: na tela de login não há o que encerrar. -->
      @if (session.isAuthenticated()) {
        <button
          type="button"
          (click)="signOut()"
          class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-500"
        >
          Sair
        </button>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6">
    <router-outlet />
  </main>
</div>
