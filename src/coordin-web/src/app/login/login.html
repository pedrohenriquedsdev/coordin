<section class="mx-auto w-full max-w-sm rounded-lg border border-slate-200 bg-white p-4 sm:p-6">
  <h2 class="text-lg font-semibold">Entrar</h2>

  <form class="mt-4 space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="showRequired('email')"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      />
      @if (showRequired('email')) {
        <p class="mt-1 text-sm text-red-700">Informe o e-mail.</p>
      }
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Senha</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showRequired('password')"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500"
      />
      @if (showRequired('password')) {
        <p class="mt-1 text-sm text-red-700">Informe a senha.</p>
      }
    </div>

    @if (error(); as message) {
      <p role="alert" class="rounded-md bg-red-50 p-3 text-sm text-red-800">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Entrar
    </button>
  </form>
</section>
